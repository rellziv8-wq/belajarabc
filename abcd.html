<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belajar ABC Kerdil - Tracing & Phonics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#FFF8E1;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#app{width:100%;max-width:500px;height:100vh;max-height:900px;background:linear-gradient(#87CEEB 0% 35%, #FFF8E1 35%);position:relative;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.1)}

/* INTRO ANIMASI */
#intro{position:absolute;inset:0;background:linear-gradient(180deg,#FFEB3B 0%, #FF9800 100%);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:all .6s cubic-bezier(.68,-0.55,.27,1.55)}
#intro.hide-intro{transform:translateY(-100%);opacity:0;pointer-events:none}
.intro-apple{font-size:80px;animation:pop 1s ease infinite alternate}
.intro-title{font-size:38px;font-weight:700;color:#000;margin-top:10px;line-height:1.1;text-shadow:3px 3px 0 white;animation:slideUp .8s ease .2s both}
.intro-title span{color:#E53935}
.intro-sub{margin-top:12px;background:#000;color:white;padding:8px 18px;border-radius:20px;font-size:14px;letter-spacing:2px;animation:slideUp .8s ease .4s both}
.intro-tagline{margin-top:22px;font-size:16px;background:white;border:3px solid #000;padding:10px 18px;border-radius:14px;box-shadow:0 6px 0 #000;animation:slideUp .8s ease .6s both}
.intro-play{margin-top:28px;background:#43A047;color:white;border:3px solid #000;padding:14px 36px;border-radius:16px;font-size:18px;box-shadow:0 6px 0 #000;cursor:pointer;animation:slideUp .8s ease .8s both}
.intro-play:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.farrel{position:absolute;bottom:28px;font-size:20px;font-weight:700;letter-spacing:2px;color:#000;text-transform:uppercase;background:white;border:3px solid #000;padding:8px 20px;border-radius:12px;box-shadow:0 5px 0 #000;animation:fade .8s ease 1s both}

@keyframes pop{0%{transform:scale(1)}100%{transform:scale(1.15) rotate(-5deg)}}
@keyframes slideUp{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}

header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.apple-logo{width:42px;height:42px;background:#E53935;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:24px;color:white;border:3px solid #000}
.top-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.letter-btn{min-width:44px;height:44px;border:3px solid #000;border-radius:12px;background:white;display:flex;justify-content:center;align-items:center;font-weight:700;cursor:pointer;flex-shrink:0}
.letter-btn.active{background:#FFEB3B;transform:scale(1.1)}
#canvas-wrap{flex:1;margin:10px 16px;background:white;border:4px solid #000;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 8px 0 #000}
canvas{width:100%;height:100%;touch-action:none}
#guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:180px;font-weight:700;color:#E0E0E0;pointer-events:none;opacity:0.6}
#object-area{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;background:#E8F5E9;border:3px solid #000;border-radius:16px;padding:8px 12px}
.controls{display:flex;gap:10px;padding:12px 16px}
.btn{flex:1;padding:14px;border:3px solid #000;border-radius:16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 5px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.btn-clear{background:#FFCDD2}.btn-sound{background:#BBDEFB}.btn-next{background:#A5D6A7}
.stars{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.star{font-size:24px;opacity:.2;transition:.3s}.star.on{opacity:1;transform:scale(1.3)}
#win{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;border-radius:20px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
<div id="intro">
<div class="intro-apple">🍎</div>
<div class="intro-title">ABC KIDS<br><span>INDONESIA</span></div>
<div class="intro-sub">BELAJAR ABC</div>
<div class="intro-tagline">✨ Belajar Sambil Bermain ✨</div>
<button class="intro-play" onclick="startGame()">MAIN ▶</button>
<div class="farrel">FARREL STUDIO</div>
</div>
<header>
<div style="display:flex;align-items:center;gap:8px"><div class="apple-logo">A</div><h1 style="font-size:18px;line-height:1.1">ABC KIDS<br><span style="color:#E53935">Indonesia</span></h1></div>
<div style="background:#000;color:#FFEB3B;padding:6px 10px;border-radius:8px;font-size:10px">TANPA IKLAN</div>
</header>
<div class="top-bar" id="letters"></div>
<div id="canvas-wrap">
<div class="stars"><span class="star" id="s1">⭐</span><span class="star" id="s2">⭐</span><span class="star" id="s3">⭐</span></div>
<div id="guide">A</div>
<canvas id="c"></canvas>
<div id="object-area"><span>🍎 <b id="word">A untuk Apel</b></span><span style="font-size:28px" id="emoji">🍎</span></div>
<div id="win" class="hide"><h2 style="font-size:32px;color:#2E7D32">HEBAT! 🎉</h2><button class="btn btn-next" style="width:180px;margin-top:12px" onclick="nextLetter()">LANJUT ▶</button></div>
</div>
<div class="controls">
<button class="btn btn-clear" onclick="clearCanvas()">HAPUS</button>
<button class="btn btn-sound" onclick="playSound()">🔊 SUARA</button>
<button class="btn btn-next" onclick="nextLetter()">NEXT ▶</button>
</div>
</div>
<script>
const DATA={ A:{word:"A untuk Apel",emoji:"🍎",phon:"A, A untuk Apel",color:"#E53935"}, B:{word:"B untuk Bola",emoji:"⚽",phon:"B, B untuk Bola",color:"#1E88E5"}, C:{word:"C untuk Ceri",emoji:"🍒",phon:"C, C untuk Ceri",color:"#43A047"}, D:{word:"D untuk Domba",emoji:"🐑",phon:"D, D untuk Domba",color:"#FB8C00"}, E:{word:"E untuk Elang",emoji:"🦅",phon:"E, E untuk Elang",color:"#8E24AA"}, F:{word:"F untuk Flamingo",emoji:"🦩",phon:"F, F untuk Flamingo",color:"#EC407A"}, G:{word:"G untuk Gajah",emoji:"🐘",phon:"G, G untuk Gajah",color:"#6D4C41"}, H:{word:"H untuk Harimau",emoji:"🐯",phon:"H, H untuk Harimau",color:"#F4511E"}, I:{word:"I untuk Ikan",emoji:"🐟",phon:"I, I untuk Ikan",color:"#00ACC1"}, J:{word:"J untuk Jerapah",emoji:"🦒",phon:"J, J untuk Jerapah",color:"#FFCA28"}, K:{word:"K untuk Kucing",emoji:"🐱",phon:"K, K untuk Kucing",color:"#7CB342"}, L:{word:"L untuk Lion",emoji:"🦁",phon:"L, L untuk Lion",color:"#FFA000"}, M:{word:"M untuk Monyet",emoji:"🐒",phon:"M, M untuk Monyet",color:"#8D6E63"}, N:{word:"N untuk Naga",emoji:"🐉",phon:"N, N untuk Naga",color:"#5E35B1"}, O:{word:"O untuk Oren",emoji:"🍊",phon:"O, O untuk Oren",color:"#FF6F00"}, P:{word:"P untuk Panda",emoji:"🐼",phon:"P, P untuk Panda",color:"#000"}, Q:{word:"Q untuk Quail",emoji:"🐦",phon:"Q, Q untuk Quail",color:"#3949AB"}, R:{word:"R untuk Rusa",emoji:"🦌",phon:"R, R untuk Rusa",color:"#A1887F"}, S:{word:"S untuk Semangka",emoji:"🍉",phon:"S, S untuk Semangka",color:"#2E7D32"}, T:{word:"T untuk Tiger",emoji:"🐅",phon:"T, T untuk Tiger",color:"#EF6C00"}, U:{word:"U untuk Ular",emoji:"🐍",phon:"U, U untuk Ular",color:"#43A047"}, V:{word:"V untuk Violin",emoji:"🎻",phon:"V, V untuk Violin",color:"#6A1B9A"}, W:{word:"W untuk Wortel",emoji:"🥕",phon:"W, W untuk Wortel",color:"#FF5722"}, X:{word:"X untuk Xylofon",emoji:"🎼",phon:"X, X untuk Xylofon",color:"#00897B"}, Y:{word:"Y untuk Yoyo",emoji:"🪀",phon:"Y, Y untuk Yoyo",color:"#FBC02D"}, Z:{word:"Z untuk Zebra",emoji:"🦓",phon:"Z, Z untuk Zebra",color:"#212121"} };
let cur='A', isDrawing=false, points=0, totalNeeded=80;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), guide=document.getElementById('guide');
const wordEl=document.getElementById('word'), emojiEl=document.getElementById('emoji'), winEl=document.getElementById('win');
function startGame(){document.getElementById('intro').classList.add('hide-intro');playSound();}
function resize(){let r=canvas.parentElement.getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;ctx.lineCap='round';ctx.lineJoin='round';clearCanvas()}
function getPos(e){let rect=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return {x:(t.clientX-rect.left)*2, y:(t.clientY-rect.top)*2}}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);points=0;updateStars();winEl.classList.add('hide');drawDotted()}
function drawDotted(){let d=DATA[cur];guide.innerText=cur;guide.style.color=d.color+"33";ctx.save();ctx.setLineDash([18,18]);ctx.strokeStyle=d.color;ctx.lineWidth=12;ctx.globalAlpha=0.25;ctx.font=`${canvas.height*0.5}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(cur, canvas.width/2, canvas.height/2-30);ctx.restore();}
function start(e){isDrawing=true;let p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
function move(e){if(!isDrawing)return;e.preventDefault();let p=getPos(e);ctx.lineWidth=18;ctx.strokeStyle=DATA[cur].color;ctx.globalAlpha=1;ctx.lineTo(p.x,p.y);ctx.stroke();points++;if(points>totalNeeded) checkWin();updateStars()}
function end(){isDrawing=false}
function updateStars(){let pct=points/totalNeeded;document.getElementById('s1').classList.toggle('on',pct>0.3);document.getElementById('s2').classList.toggle('on',pct>0.6);document.getElementById('s3').classList.toggle('on',pct>0.9);}
function checkWin(){if(points>=totalNeeded){winEl.classList.remove('hide');playSound(true);if(navigator.vibrate) navigator.vibrate(100)}}
function playSound(isWin=false){if(!('speechSynthesis' in window)) return;let u=new SpeechSynthesisUtterance(isWin? "Hore, hebat! "+DATA[cur].phon : DATA[cur].phon);u.lang='id-ID';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u);}
function loadLetter(l){cur=l;wordEl.innerText=DATA[l].word;emojiEl.innerText=DATA[l].emoji;document.querySelectorAll('.letter-btn').forEach(b=>b.classList.toggle('active',b.dataset.l==l));clearCanvas();setTimeout(playSound,300);}
function nextLetter(){let keys=Object.keys(DATA);let idx=keys.indexOf(cur);let next=keys[(idx+1)%keys.length];loadLetter(next);}
let bar=document.getElementById('letters');Object.keys(DATA).forEach(l=>{let b=document.createElement('div');b.className='letter-btn';b.dataset.l=l;b.innerText=l;b.onclick=()=>loadLetter(l);bar.appendChild(b);});
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
window.addEventListener('resize',resize);
resize();loadLetter('A');
</script>
</body>
</html>
